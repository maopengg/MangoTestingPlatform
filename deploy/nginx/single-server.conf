server {
    listen 80;
    server_name _;
    client_max_body_size 200m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location = /healthz {
        access_log off;
        proxy_pass http://mango_server:8000/management/health;
    }
    location /api/ { proxy_pass http://mango_server:8000; }
    location = /api { proxy_pass http://mango_server:8000; }
    location /ws/ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://realtime_service:8011;
    }
    location = /mcp {
        proxy_buffering off;
        proxy_pass http://mcp_service:8010/;
    }
    location /mcp/ {
        proxy_buffering off;
        rewrite ^/mcp/(.*)$ /$1 break;
        proxy_pass http://mcp_service:8010;
    }
    location /mango-file/ {
        alias /mango-media/;
        autoindex off;
        add_header X-Content-Type-Options nosniff;
    }
    location / { proxy_pass http://mango-console:80; }
}
