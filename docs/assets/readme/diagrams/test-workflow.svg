<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="495" viewBox="0 0 1200 495" role="img" aria-labelledby="title description">
<title id="title">芒果测试平台测试闭环</title><desc id="description">配置项目环境、构建自动化资产、准备数据、触发执行、查看报告、修复并重新验证；清理按用例配置执行。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b5c6cf"/></marker></defs>
<rect width="1200" height="495" fill="#ffffff"/>
<g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="40" y="55" font-size="32" fill="#17324d" font-weight="700" text-anchor="start">从准备到验证：一条测试闭环</text><rect x="30" y="108" width="170" height="150" rx="12" fill="#f4f8f7" stroke="#b5c6cf"/><text x="44" y="138" font-size="16" fill="#086f65" font-weight="600" text-anchor="start">1</text><text x="44" y="174" font-size="19" fill="#17324d" font-weight="600" text-anchor="start">配置项目与环境</text><text x="44" y="209" font-size="15" fill="#526575" font-weight="400" text-anchor="start">项目 · 产品 · 模块</text><text x="44" y="236" font-size="15" fill="#526575" font-weight="400" text-anchor="start">环境 · 测试对象</text><path d="M 200 181 H 221" fill="none" stroke="#b5c6cf" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="225" y="108" width="170" height="150" rx="12" fill="#f4f8f7" stroke="#b5c6cf"/><text x="239" y="138" font-size="16" fill="#086f65" font-weight="600" text-anchor="start">2</text><text x="239" y="174" font-size="19" fill="#17324d" font-weight="600" text-anchor="start">构建测试资产</text><text x="239" y="209" font-size="15" fill="#526575" font-weight="400" text-anchor="start">API / UI / Pytest</text><text x="239" y="236" font-size="15" fill="#526575" font-weight="400" text-anchor="start">步骤 · 参数 · 断言</text><path d="M 395 181 H 416" fill="none" stroke="#b5c6cf" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="420" y="108" width="170" height="150" rx="12" fill="#f4f8f7" stroke="#b5c6cf"/><text x="434" y="138" font-size="16" fill="#086f65" font-weight="600" text-anchor="start">3</text><text x="434" y="174" font-size="19" fill="#17324d" font-weight="600" text-anchor="start">准备测试数据</text><text x="434" y="209" font-size="15" fill="#526575" font-weight="400" text-anchor="start">数据工厂 · 变量</text><text x="434" y="236" font-size="15" fill="#526575" font-weight="400" text-anchor="start">必要的前置与依赖</text><path d="M 590 181 H 611" fill="none" stroke="#b5c6cf" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="615" y="108" width="170" height="150" rx="12" fill="#f4f8f7" stroke="#b5c6cf"/><text x="629" y="138" font-size="16" fill="#086f65" font-weight="600" text-anchor="start">4</text><text x="629" y="174" font-size="19" fill="#17324d" font-weight="600" text-anchor="start">触发并执行任务</text><text x="629" y="209" font-size="15" fill="#526575" font-weight="400" text-anchor="start">手工 · 任务组 · 定时</text><text x="629" y="236" font-size="15" fill="#526575" font-weight="400" text-anchor="start">Worker / 执行器</text><path d="M 785 181 H 806" fill="none" stroke="#b5c6cf" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="810" y="108" width="170" height="150" rx="12" fill="#f4f8f7" stroke="#b5c6cf"/><text x="824" y="138" font-size="16" fill="#086f65" font-weight="600" text-anchor="start">5</text><text x="824" y="174" font-size="19" fill="#17324d" font-weight="600" text-anchor="start">查看执行报告</text><text x="824" y="209" font-size="15" fill="#526575" font-weight="400" text-anchor="start">断言 · 日志 · 截图</text><text x="824" y="236" font-size="15" fill="#526575" font-weight="400" text-anchor="start">请求 · 响应 · 附件</text><path d="M 980 181 H 1001" fill="none" stroke="#b5c6cf" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1005" y="108" width="170" height="150" rx="12" fill="#f4f8f7" stroke="#b5c6cf"/><text x="1019" y="138" font-size="16" fill="#086f65" font-weight="600" text-anchor="start">6</text><text x="1019" y="174" font-size="19" fill="#17324d" font-weight="600" text-anchor="start">修复与复跑</text><text x="1019" y="209" font-size="15" fill="#526575" font-weight="400" text-anchor="start">定位失败与变化</text><text x="1019" y="236" font-size="15" fill="#526575" font-weight="400" text-anchor="start">核对清理与验证结果</text><path d="M 1090 258 V 335 H 310 V 261" fill="none" stroke="#b5c6cf" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="690" y="320" font-size="19" fill="#526575" font-weight="400" text-anchor="middle">依据失败和需求变化改进测试资产，再次验证</text><rect x="40" y="395" width="1120" height="70" rx="12" fill="#edf5f3" stroke="#edf5f3"/><text x="600" y="424" font-size="20" fill="#17324d" font-weight="400" text-anchor="middle">API：服务端 Worker　｜　UI / Pytest：具备相应能力的在线执行器</text><text x="600" y="451" font-size="18" fill="#526575" font-weight="400" text-anchor="middle">前后置与数据清理按用例配置执行；报告记录实际结果</text></g></svg>