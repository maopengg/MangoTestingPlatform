x-mango-server-env: &mango-server-env
  TZ: ${TZ:-Asia/Shanghai}
  DJANGO_SETTINGS_MODULE: src.settings
  DJANGO_ENV: ${DJANGO_ENV}
  MANGO_RUNTIME_DIR: /app/runtime
  FILE_STORAGE_BACKEND: ${FILE_STORAGE_BACKEND:-minio}
  MINIO_STORAGE_ENDPOINT: minio:9000
  MINIO_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
  MINIO_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  MINIO_STORAGE_USE_HTTPS: "false"
  MINIO_STORAGE_MEDIA_BUCKET_NAME: mango-file
  MINIO_STORAGE_AUTO_CREATE_MEDIA_BUCKET: "true"
  MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-/minio/mango-file}
  LIVE_STREAM_SIGNING_KEY: ${LIVE_STREAM_SIGNING_KEY:-}
  LIVE_STREAM_PREVIOUS_SIGNING_KEY: ${LIVE_STREAM_PREVIOUS_SIGNING_KEY:-}
  REALTIME_MESSAGE_BATCH_SIZE: ${REALTIME_MESSAGE_BATCH_SIZE:-100}
  REALTIME_MESSAGE_ACTIVE_INTERVAL: ${REALTIME_MESSAGE_ACTIVE_INTERVAL:-0.2}
  REALTIME_MESSAGE_IDLE_INTERVAL: ${REALTIME_MESSAGE_IDLE_INTERVAL:-1}
  REALTIME_MESSAGE_SEND_TIMEOUT: ${REALTIME_MESSAGE_SEND_TIMEOUT:-5}
  REALTIME_MESSAGE_LEASE_SECONDS: ${REALTIME_MESSAGE_LEASE_SECONDS:-30}
  REALTIME_MESSAGE_MAX_RETRIES: ${REALTIME_MESSAGE_MAX_RETRIES:-7}

x-mango-server-common: &mango-server-common
  image: mango-server:${DJANGO_ENV}
  restart: unless-stopped
  volumes:
    - /mango_data/server_runtime:/app/runtime
  environment:
    <<: *mango-server-env
  networks:
    - app_network

services:
  db:
    image: mysql:8.0.40-debian
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - /mango_data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 10s
      retries: 5
    networks:
      app_network:
        aliases: [db]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z.fips
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - /mango_data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 10s
      retries: 5
    networks:
      app_network:
        aliases: [minio]

  system_init:
    <<: *mango-server-common
    environment:
      <<: *mango-server-env
      MANGO_SERVICE_NAME: system-init
      MANGO_SERVICE_INSTANCE: system-init-1
    command: python manage.py init_system_data --env=${DJANGO_ENV}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  mango_server:
    <<: *mango-server-common
    environment:
      <<: *mango-server-env
      MANGO_SERVICE_NAME: core-api
      MANGO_SERVICE_INSTANCE: core-api-1
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    build:
      context: .
      dockerfile: MangoServer/Dockerfile
      args:
        DJANGO_ENV: ${DJANGO_ENV}
    expose:
      - "8000"
    depends_on:
      system_init:
        condition: service_completed_successfully
    networks:
      app_network:
        aliases: [server]
    hostname: server

  scheduler_service:
    <<: *mango-server-common
    environment:
      <<: *mango-server-env
      MANGO_SERVICE_NAME: scheduler-service
      MANGO_SERVICE_INSTANCE: scheduler-1
    command: python manage.py run_scheduler --env=${DJANGO_ENV} --node-name=scheduler-1 --dispatch-batch-size=50
    depends_on:
      mango_server:
        condition: service_started

  api_worker_1:
    <<: *mango-server-common
    environment:
      <<: *mango-server-env
      MANGO_SERVICE_NAME: api-worker
      MANGO_SERVICE_INSTANCE: api-worker-1
    command: python manage.py run_api_worker --env=${DJANGO_ENV} --worker-name=api-worker-1 --thread-pool-size=5 --db-idle-seconds=1800
    depends_on:
      mango_server:
        condition: service_started

  api_worker_2:
    <<: *mango-server-common
    environment:
      <<: *mango-server-env
      MANGO_SERVICE_NAME: api-worker
      MANGO_SERVICE_INSTANCE: api-worker-2
    command: python manage.py run_api_worker --env=${DJANGO_ENV} --worker-name=api-worker-2 --thread-pool-size=5 --db-idle-seconds=1800
    depends_on:
      mango_server:
        condition: service_started

  mcp_service:
    <<: *mango-server-common
    environment:
      <<: *mango-server-env
      MANGO_SERVICE_NAME: mcp-service
      MANGO_SERVICE_INSTANCE: mcp-1
    command: python manage.py run_mcp_service --env=${DJANGO_ENV} --host=0.0.0.0 --port=8010 --workers=${MCP_WORKERS:-1}
    expose:
      - "8010"
    depends_on:
      mango_server:
        condition: service_started

  realtime_service:
    <<: *mango-server-common
    environment:
      <<: *mango-server-env
      MANGO_SERVICE_NAME: realtime-service
      MANGO_SERVICE_INSTANCE: realtime-1
    command: python manage.py run_realtime_service --env=${DJANGO_ENV} --host=0.0.0.0 --port=8011 --workers=1
    expose:
      - "8011"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      mango_server:
        condition: service_started

  monitoring_service:
    <<: *mango-server-common
    environment:
      <<: *mango-server-env
      MANGO_SERVICE_NAME: monitoring-service
      MANGO_SERVICE_INSTANCE: monitoring-1
    command: python manage.py run_monitoring_service --env=${DJANGO_ENV} --instance-name=monitoring-1 --poll-interval=2
    depends_on:
      mango_server:
        condition: service_started

  mango_gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "8000:80"
    volumes:
      - ./deploy/nginx/mango-server.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      mango_server:
        condition: service_started
      mcp_service:
        condition: service_started
      realtime_service:
        condition: service_healthy
      mango-console:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - app_network

  mango-console:
    build:
      # 前端构建需要将仓库根目录 skill/ 一并打包进静态资源。
      context: .
      dockerfile: mango-console/Dockerfile
      args:
        VUE_ENV: ${VUE_ENV}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    expose:
      - "80"
    networks: [app_network]

  mango_actuator:
    build:
      context: ./MangoActuator
      dockerfile: deploy/docker/Dockerfile
      args:
        ACTUATOR_PROFILE: ${ACTUATOR_PROFILE:-standard}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MANGO_ACTUATOR_RUNTIME_DIR: /app/runtime
    command:
      - python
      - headless_main.py
      - --profile
      - ${ACTUATOR_PROFILE:-standard}
      - --host
      - ${ACTUATOR_HOST}
      - --username
      - ${ACTUATOR_USERNAME}
      - --password
      - ${ACTUATOR_PASSWORD}
      - --web-parallel
      - ${ACTUATOR_WEB_PARALLEL:-5}
      - --ui-queue-size
      - ${ACTUATOR_UI_QUEUE_SIZE:-10}
      - --pytest-parallel
      - ${ACTUATOR_PYTEST_PARALLEL:-5}
      - --pytest-queue-size
      - ${ACTUATOR_PYTEST_QUEUE_SIZE:-10}
    volumes:
      - /mango_data/actuator_runtime:/app/runtime
    depends_on:
      mango_server:
        condition: service_started
    networks:
      app_network:
        aliases: [actuator]

networks:
  app_network:
    driver: bridge
