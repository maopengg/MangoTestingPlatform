name: mango

x-environment: &environment
  TZ: Asia/Shanghai
  DJANGO_ENV: master
  DJANGO_SETTINGS_MODULE: src.settings
  MANGO_RUNTIME_DIR: /app/runtime
  FILE_STORAGE_BACKEND: local
  MYSQL_HOST: db
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: ${MYSQL_DATABASE:-mango_server}
  MYSQL_USER: ${MYSQL_USER:-mango}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run sh deploy.sh first}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run sh deploy.sh first}
  LIVE_STREAM_SIGNING_KEY: ${LIVE_STREAM_SIGNING_KEY:?Run sh deploy.sh first}
  MANGO_INITIAL_ADMIN_PASSWORD: ${MANGO_INITIAL_ADMIN_PASSWORD:?Run sh deploy.sh first}
  MANGO_INITIAL_GUEST_PASSWORD: ${MANGO_INITIAL_GUEST_PASSWORD:?Run sh deploy.sh first}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}

x-backend: &backend
  image: mango-server:single
  restart: unless-stopped
  environment: *environment
  volumes:
    - ${MANGO_DATA_DIR:-/mango_data}/server_runtime:/app/runtime
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  db:
    image: mysql:8.0.40-debian
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mango_server}
      MYSQL_USER: ${MYSQL_USER:-mango}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run sh deploy.sh first}
    command: ["--innodb-buffer-pool-size=256M", "--max-connections=100"]
    volumes:
      - ${MANGO_DATA_DIR:-/mango_data}/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      start_period: 40s
      retries: 24

  mango_server:
    <<: *backend
    build:
      context: ..
      dockerfile: MangoServer/Dockerfile
      args:
        DJANGO_ENV: master
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
    environment:
      <<: *environment
      MANGO_SERVICE_NAME: core-api
      MANGO_SERVICE_INSTANCE: core-api-1
      UVICORN_WORKERS: "1"
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/management/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 12

  scheduler_service:
    <<: *backend
    environment:
      <<: *environment
      MANGO_SERVICE_NAME: scheduler-service
      MANGO_SERVICE_INSTANCE: scheduler-1
    command: python manage.py run_scheduler --node-name=scheduler-1 --dispatch-batch-size=20
    depends_on:
      mango_server: {condition: service_healthy}

  api_worker_1:
    <<: *backend
    environment:
      <<: *environment
      MANGO_SERVICE_NAME: api-worker
      MANGO_SERVICE_INSTANCE: api-worker-1
    command: python manage.py run_api_worker --worker-name=api-worker-1 --thread-pool-size=2 --db-idle-seconds=1800
    depends_on:
      mango_server: {condition: service_healthy}

  mcp_service:
    <<: *backend
    environment:
      <<: *environment
      MANGO_SERVICE_NAME: mcp-service
      MANGO_SERVICE_INSTANCE: mcp-1
    command: python manage.py run_mcp_service --host=0.0.0.0 --port=8010 --workers=1
    depends_on:
      mango_server: {condition: service_healthy}

  realtime_service:
    <<: *backend
    environment:
      <<: *environment
      MANGO_SERVICE_NAME: realtime-service
      MANGO_SERVICE_INSTANCE: realtime-1
    command: python manage.py run_realtime_service --host=0.0.0.0 --port=8011 --workers=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    depends_on:
      mango_server: {condition: service_healthy}

  monitoring_service:
    <<: *backend
    environment:
      <<: *environment
      MANGO_SERVICE_NAME: monitoring-service
      MANGO_SERVICE_INSTANCE: monitoring-1
    command: python manage.py run_monitoring_service --instance-name=monitoring-1 --poll-interval=5
    depends_on:
      mango_server: {condition: service_healthy}

  mango-console:
    image: mango-console:single
    restart: unless-stopped
    build:
      context: ..
      dockerfile: mango-console/Dockerfile
      args:
        VUE_ENV: master
        NODE_HEAP_MB: ${NODE_HEAP_MB:-2560}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}

  mango_gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8000}:80"
    volumes:
      - ./nginx/single-server.conf:/etc/nginx/conf.d/default.conf:ro
      - ${MANGO_DATA_DIR:-/mango_data}/server_runtime/media:/mango-media:ro
    depends_on:
      mango_server: {condition: service_healthy}
      realtime_service: {condition: service_healthy}
      mcp_service: {condition: service_started}
      mango-console: {condition: service_started}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
